[project]
name = "strands-issue-writer"
version = "0.1.2"
description = "A Strands agent that turns raw product chatter into well-formed issue tracker entries, powered by a locally served fine-tuned model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Furkan Portakal" }]
keywords = ["strands", "agent", "llm", "jira", "issue-tracker", "ollama", "vllm", "lora"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "strands-agents>=1.0",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/fport/strands-issue-writer"
Dataset = "https://huggingface.co/datasets/fport/issue-writer-tr-en"
Training = "https://github.com/fport/issue-writer"
Issues = "https://github.com/fport/strands-issue-writer/issues"

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
vllm   = ["openai>=1.50"]
dashboard = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
all = ["ollama>=0.4", "openai>=1.50", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pytest-asyncio>=0.24"]

[project.scripts]
strands-issue-writer = "strands_issue_writer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strands_issue_writer"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
