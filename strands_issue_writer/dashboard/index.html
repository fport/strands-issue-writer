<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>issue writer</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --line:#252d38; --ink:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad)}
  h1{font:600 14px var(--mono);margin:0;letter-spacing:.02em}
  .provider{font:12px var(--mono);color:var(--dim);margin-left:auto;text-align:right}
  main{display:grid;grid-template-columns:340px 1fr 320px;gap:1px;background:var(--line);
       height:calc(100vh - 49px)}
  section{background:var(--bg);overflow-y:auto;padding:16px}
  h2{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;
     color:var(--dim);margin:0 0 12px}
  textarea{width:100%;min-height:150px;background:var(--panel);color:var(--ink);
           border:1px solid var(--line);border-radius:8px;padding:11px;
           font:13px/1.5 var(--mono);resize:vertical}
  textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  button{background:var(--accent);color:#04121f;border:0;border-radius:7px;
         padding:8px 15px;font:600 13px inherit;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:7px;padding:8px;font:13px inherit}
  .hist{margin-top:18px}
  .hist div{padding:8px 10px;border-left:2px solid var(--line);margin-bottom:6px;
            color:var(--dim);font:12px var(--mono);cursor:pointer;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist div:hover{border-left-color:var(--accent);color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:16px;margin-bottom:14px}
  .type{display:inline-block;font:600 11px var(--mono);padding:2px 8px;
        border-radius:4px;background:#1f6feb22;color:var(--accent);
        border:1px solid #1f6feb44}
  .type.Bug{background:#f8514922;color:var(--bad);border-color:#f8514944}
  .type.Epic{background:#a371f722;color:#a371f7;border-color:#a371f744}
  .type.Spike{background:#d2992222;color:var(--warn);border-color:#d2992244}
  .summary{font:600 17px/1.35 inherit;margin:10px 0 12px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chip{font:11px var(--mono);padding:2px 8px;border:1px solid var(--line);
        border-radius:20px;color:var(--dim)}
  .desc{white-space:pre-wrap;font:13px/1.65 var(--mono);color:#c9d1d9;
        border-top:1px solid var(--line);padding-top:13px;margin-top:13px}
  .desc b{color:var(--ink)}
  .verdict{padding:11px 13px;border-radius:8px;margin-bottom:12px;font-size:13px}
  .verdict.pass{background:#3fb95015;border:1px solid #3fb95040;color:var(--ok)}
  .verdict.fail{background:#f8514915;border:1px solid #f8514940;color:var(--bad)}
  ul{margin:8px 0 0;padding-left:18px}
  li{margin-bottom:5px;color:var(--dim);font-size:13px}
  li.bad{color:var(--bad)} li.warn{color:var(--warn)}
  .empty{color:var(--dim);font:13px var(--mono);padding:26px 0;text-align:center}
  .pulse{animation:p 1.1s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  .stat{font:11px var(--mono);color:var(--dim);margin-top:10px}
  @media(max-width:1100px){main{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>issue writer</h1>
  <span class="provider" id="provider">connecting…</span>
</header>

<main>
  <section>
    <h2>raw input</h2>
    <textarea id="input" placeholder="Paste a Slack message, a support ticket, a Sentry alert…"></textarea>
    <div class="row">
      <button id="send">Draft</button>
      <select id="lang">
        <option value="auto">auto</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
      <span class="stat" id="elapsed"></span>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <section>
    <h2>drafted issue</h2>
    <div id="issue"><div class="empty">nothing drafted yet</div></div>
  </section>

  <section>
    <h2>rule review</h2>
    <div id="review"><div class="empty">—</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let ws, history = [];

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { setStatus(false, "disconnected"); setTimeout(connect, 2500); };
}

function setStatus(ok, text){
  $("dot").className = "dot " + (ok ? "on" : "off");
  $("provider").textContent = text;
}

function handle(m){
  if (m.type === "status"){
    setStatus(m.ok, m.ok ? m.provider : `${m.provider} — ${m.detail}`);
  }
  else if (m.type === "drafting"){
    $("issue").innerHTML = '<div class="empty pulse">drafting…</div>';
    $("review").innerHTML = '<div class="empty">—</div>';
    $("send").disabled = true;
  }
  else if (m.type === "error"){
    $("send").disabled = false;
    $("issue").innerHTML = `<div class="verdict fail">${esc(m.meta.error)}</div>
      <div class="desc">${esc(m.meta.raw || JSON.stringify(m.meta.detail || {}, null, 2))}</div>`;
  }
  else if (m.type === "issue"){
    $("send").disabled = false;
    $("elapsed").textContent = `${m.elapsed}s · ${m.language}`;
    renderIssue(m.issue);
    renderReview(m.review, m.issue);
    history.unshift({ text: $("input").value, issue: m.issue, review: m.review });
    renderHistory();
  }
}

function renderIssue(i){
  const chips = [
    `priority ${i.priority}`,
    i.severity ? `severity ${i.severity}` : null,
    i.story_points ? `${i.story_points} points` : null,
    ...(i.components || []),
    ...(i.labels || []),
  ].filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("");

  const desc = esc(i.description)
    .replace(/^h2\. (.+)$/gm, "<b>$1</b>")
    .replace(/\*([^*\n]+)\*/g, "<b>$1</b>");

  $("issue").innerHTML = `<div class="card">
      <span class="type ${esc(i.issue_type)}">${esc(i.issue_type)}</span>
      <div class="summary">${esc(i.summary)}</div>
      <div class="meta">${chips}</div>
      <div class="desc">${desc}</div>
    </div>`;
}

function renderReview(v, issue){
  const head = v.ok
    ? `<div class="verdict pass">passes the writing rules</div>`
    : `<div class="verdict fail">${v.violations.length} rule violation${v.violations.length > 1 ? "s" : ""}</div>`;

  const list = (title, items, cls) => items && items.length
    ? `<h2 style="margin-top:16px">${title}</h2><ul>${items.map(x => `<li class="${cls}">${esc(x)}</li>`).join("")}</ul>`
    : "";

  $("review").innerHTML = head
    + list("violations", v.violations, "bad")
    + list("warnings", v.warnings, "warn")
    + list("assumptions", issue.assumptions, "")
    + list("open questions", issue.clarifying_questions, "")
    + `<div class="stat">checked: ${v.checked.join(" · ")}</div>`;
}

function renderHistory(){
  $("hist").innerHTML = history.slice(0, 12).map((h, n) =>
    `<div data-n="${n}">${h.review.ok ? "✓" : "✗"} ${esc(h.issue.summary)}</div>`).join("");
  [...$("hist").children].forEach(el => el.onclick = () => {
    const h = history[+el.dataset.n];
    $("input").value = h.text; renderIssue(h.issue); renderReview(h.review, h.issue);
  });
}

function send(){
  const text = $("input").value.trim();
  if (text && ws?.readyState === 1)
    ws.send(JSON.stringify({ text, lang: $("lang").value }));
}
$("send").onclick = send;
$("input").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") send();
});
connect();
</script>
</body>
</html>
