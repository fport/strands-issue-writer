<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="strands-issue-writer">
  <title>strands-issue-writer</title>
  <defs>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#f97316" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#f97316" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- three loose strands entering from the left: raw, unstructured input -->
  <g fill="none" stroke="url(#thread)" stroke-linecap="round">
    <path d="M8 58 C40 40, 44 78, 78 66"  stroke-width="5"/>
    <path d="M8 100 C38 92, 46 108, 78 100" stroke-width="5"/>
    <path d="M8 142 C40 160, 44 122, 78 134" stroke-width="5"/>
  </g>

  <!-- they converge -->
  <circle cx="86" cy="100" r="7" fill="#f97316"/>

  <!-- and leave as one structured record -->
  <rect x="104" y="52" width="88" height="96" rx="10" fill="url(#card)"
        stroke="#f97316" stroke-width="2.5"/>
  <g fill="#f97316">
    <rect x="118" y="70"  width="46" height="7" rx="3.5"/>
    <rect x="118" y="88"  width="60" height="5" rx="2.5" opacity=".55"/>
    <rect x="118" y="101" width="52" height="5" rx="2.5" opacity=".55"/>
    <rect x="118" y="114" width="58" height="5" rx="2.5" opacity=".55"/>
  </g>
  <!-- the check that says it passed the rules -->
  <path d="M120 131 l7 7 l13 -14" fill="none" stroke="#22c55e"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
